name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test-core:
    name: Unit tests (.NET 10, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore tests/EverythingPal.Core.Tests/EverythingPal.Core.Tests.csproj

      - name: Test
        run: >
          dotnet test tests/EverythingPal.Core.Tests/EverythingPal.Core.Tests.csproj
          --configuration Release --no-restore
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore

  build-extension:
    name: Build Store bundle (Windows x64 + ARM64, unsigned)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # This is the exact same pipeline the Store release uses: self-contained Release publish for
      # both architectures, bundled es.exe + notices, per-arch .msix, then .msixbundle, then a full
      # unpack/identity/architecture/unsigned validation. Running it on every push keeps the Store
      # packaging path green.
      - name: Publish, pack, bundle and validate (scripts/pack-store.ps1)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/pack-store.ps1 -OutputDir artifacts/store

      - name: Upload unsigned Store bundle + per-arch packages
        uses: actions/upload-artifact@v4
        with:
          name: EverythingPal-unsigned-store-bundle
          path: |
            artifacts/store/*.msixbundle
            artifacts/store/*.msix
            artifacts/store/manifests/*
          if-no-files-found: error
