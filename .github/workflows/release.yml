name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.0.0.0); defaults to the tag or the manifest version"
        required: false
        default: ""

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: Build unsigned Store bundle (signed sideload build when secrets are set)
    runs-on: windows-latest
    env:
      SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
      SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if (-not $version) {
            $ref = "${{ github.ref_name }}"
            $version = $ref -replace '^v', ''
          }
          # Leave it empty when it does not look like a package version: scripts/pack-store.ps1 then
          # falls back to Identity/@Version in Package.appxmanifest.
          if ($version -notmatch '^\d+(\.\d+){1,3}$') { $version = "" }
          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Package version: $version"

      # One source of truth for packaging: the same script used locally and by CI. It publishes
      # self-contained (x64 + ARM64), bundles the MIT es.exe, creates an UNSIGNED per-arch .msix +
      # .msixbundle and validates identity/version/architecture + self-contained payload.
      - name: Publish, pack, bundle and validate (scripts/pack-store.ps1)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $parameters = @{}
          if ("${{ steps.version.outputs.value }}") { $parameters["Version"] = "${{ steps.version.outputs.value }}" }
          ./scripts/pack-store.ps1 @parameters

      # Optional: sign for GitHub/sideload distribution. NEVER upload a signed package to the Store -
      # the Store re-signs the unsigned bundle and rejects a mismatched publisher. When no signing
      # secrets are configured the artifacts stay unsigned (which is what Store submission wants).
      # SignTool recursively signs the packages inside a bundle, so the bundle goes first.
      - name: Sign packages (optional)
        if: ${{ env.SIGNING_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                      Where-Object { $_.FullName -match '\\x64\\' } |
                      Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          try {
            $bundle = Get-ChildItem "artifacts/store" -Filter *.msixbundle | Select-Object -First 1
            if (-not $bundle) { throw "no .msixbundle produced" }
            & $signtool.FullName sign /fd SHA256 /f cert.pfx /p $env:SIGNING_PFX_PASSWORD $bundle.FullName
            if ($LASTEXITCODE -ne 0) { throw "signing failed: $($bundle.Name)" }
            & $signtool.FullName verify /pa $bundle.FullName
            if ($LASTEXITCODE -ne 0) { throw "signature verification failed: $($bundle.Name)" }
            foreach ($msix in Get-ChildItem "artifacts/store" -Filter *.msix) {
              & $signtool.FullName sign /fd SHA256 /f cert.pfx /p $env:SIGNING_PFX_PASSWORD $msix.FullName
              if ($LASTEXITCODE -ne 0) { throw "signing failed: $($msix.Name)" }
              & $signtool.FullName verify /pa $msix.FullName
              if ($LASTEXITCODE -ne 0) { throw "signature verification failed: $($msix.Name)" }
            }
          }
          finally {
            Remove-Item cert.pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/store/*.msixbundle
            artifacts/store/*.msix
          body: |
            Everything Search for PowerToys Command Palette.

            - **Self-contained**: the .NET 10 runtime is bundled, nothing else to install.
            - Bundled `es.exe` (MIT, from https://github.com/voidtools/ES) — no separate ES install needed.
            - Requires Windows 11 x64/ARM64, PowerToys with Command Palette, and **Everything installed and running**.
            - The `EverythingPal_<version>_x64_arm64.msixbundle` contains both the x64 and the ARM64 package.

            **Microsoft Store**: upload the **unsigned** `.msixbundle` to Partner Center; the Store
            re-signs it. Signed assets in this release (when a signing certificate is configured) are
            for manual sideloading only — sign/trust the certificate first.

            Unsigned per-arch `.msix` files can be installed on a machine with Developer Mode enabled,
            or signed locally with
            `signtool sign /fd SHA256 /f <cert.pfx> /p <password> <file.msix>`.
